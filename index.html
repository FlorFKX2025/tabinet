<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabinet • v0.7.6</title>
</head>
<body style="margin:0;background:#071b13;color:#f5f2e8;font-family:system-ui,sans-serif">
<div id="boot" style="min-height:100vh;display:grid;place-items:center"><div style="text-align:center"><strong style="font-size:42px;color:#e7c76b">Tabinet</strong><div style="opacity:.7;margin-top:8px">Se încarcă build-ul v0.7.6…</div></div></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));
    }
    const b64=await fetch('./build-v0.7.6.tgz.b64?cachebust=076',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('build '+r.status);return r.text();});
    const raw=atob(b64.replace(/\\s+/g,''));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Browserul nu suportă DecompressionStream.');
    const ds=new DecompressionStream('gzip');
    const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    const u8=new Uint8Array(ab);
    const files={};
    let off=0;
    const text=new TextDecoder();
    while(off+512<=u8.length){
      let end=off+100, nameEnd=off;
      const nameBytes=u8.subarray(off,off+100);
      let name='';
      for(let i=0;i<100&&nameBytes[i];i++)name+=String.fromCharCode(nameBytes[i]);
      if(!name)break;
      let sizeText='';
      for(let i=off+124;i<off+136;i++){const c=u8[i]; if(c&&c!==32) sizeText+=String.fromCharCode(c);}
      const size=parseInt(sizeText.trim()||'0',8)||0;
      const start=off+512;
      files[name]=u8.slice(start,start+size);
      off=start+Math.ceil(size/512)*512;
    }
    const getText=p=>text.decode(files[p]||new Uint8Array());
    let index=getText('dist/index.html');
    const css=getText('dist/styles.css');
    const rules=getText('dist/rules.js');
    let app=getText('dist/app.js');
    app=app.replace(/if \('serviceWorker' in navigator\) navigator\.serviceWorker\.register\('\.\/sw\.js'\)\.catch\(\(\) => \{\}\);/g,'');
    const parsed=new DOMParser().parseFromString(index,'text/html');
    parsed.querySelectorAll('link[rel="stylesheet"][href="./styles.css"]').forEach(n=>n.remove());
    parsed.querySelectorAll('script[src="./rules.js"],script[src="./app.js"]').forEach(n=>n.remove());
    const style=parsed.createElement('style');
    style.textContent=css;
    parsed.head.appendChild(style);
    document.documentElement.replaceWith(document.importNode(parsed.documentElement,true));
    const rulesScript=document.createElement('script');
    rulesScript.textContent=rules;
    document.body.appendChild(rulesScript);
    const appScript=document.createElement('script');
    appScript.textContent=app;
    document.body.appendChild(appScript);
  }catch(err){
    console.error(err);
    if(boot) boot.innerHTML='<div style="text-align:center;padding:24px"><strong>Nu s-a putut încărca v0.7.6.</strong><p style="opacity:.7">'+String(err.message||err)+'</p></div>';
  }
})();
</script>
</body>
</html>
