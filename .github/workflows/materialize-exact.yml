name: Materialize exact Tabinet v0.7.6 on main

on:
  push:
    branches: [main]
    paths:
      - ".transfer-v076/MATERIALIZE"

permissions:
  contents: write

concurrency:
  group: materialize-v076
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact v0.7.6 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f exact-v076.b64 exact-v076.gz exact-v076.zip
          for part in .transfer-v076/part-*.b64; do
            cat "$part" >> exact-v076.b64
          done
          test "$(wc -c < exact-v076.b64)" -eq 63288
          base64 --decode exact-v076.b64 > exact-v076.gz
          gzip -t exact-v076.gz
          gzip -dc exact-v076.gz > exact-v076.zip
          printf '9842e540ce877391332c8a66af3e1442038be768d8b3ed8b15a27cd2bc490629  exact-v076.zip\n' | sha256sum -c -
          unzip -t exact-v076.zip

      - name: Replace repository root with exact local dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-site
          mkdir -p exact-site
          unzip -oq exact-v076.zip -d exact-site

          cp exact-site/index.html index.html
          cp exact-site/styles.css styles.css
          cp exact-site/app.js app.js
          cp exact-site/rules.js rules.js
          cp exact-site/manifest.webmanifest manifest.webmanifest
          cp exact-site/sw.js sw.js
          mkdir -p icons
          cp exact-site/icons/icon.svg icons/icon.svg

          # Force a new service-worker source so the browser abandons the old hosted cache.
          sed -i 's/tabinet-v0.7.6/tabinet-v0.7.6-pages-sync-2/' sw.js

          rm -f app-01.js app-02.js app-03.js app-04.js app-05.js
          rm -f style-01.css style-02.css style-03.css style-04.css
          rm -f loader.js

          test "$(wc -c < index.html)" -eq 24456
          test "$(wc -c < styles.css)" -eq 62812
          test "$(wc -c < app.js)" -eq 97640
          test "$(wc -c < rules.js)" -eq 6468
          test "$(wc -c < manifest.webmanifest)" -eq 341
          test "$(wc -c < icons/icon.svg)" -eq 733

      - name: Commit exact root build on a staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js rules.js manifest.webmanifest sw.js icons/icon.svg
          git add -u app-01.js app-02.js app-03.js app-04.js app-05.js style-01.css style-02.css style-03.css style-04.css loader.js
          git commit -m "Materialize exact local Tabinet v0.7.6 at repository root"
          git branch -M exact-v076-root
          git push --force origin exact-v076-root
          echo "EXACT_ROOT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
