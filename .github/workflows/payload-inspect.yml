name: Inspect stored compressed payloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          for p in app-p1.b64 app-p2.b64 app-p3.b64 app-p4.b64 app-p5.b64 app-p6.b64 app-p6a.b64 a15-01.b64 a15-02.b64 a15-03.b64 a15-04.b64 a15-05.b64 a15-06.b64 app10-02.b64 app10-03.b64 app10-04.b64 app20-p1.b64 app20-p5.b64; do
            echo "=== $p ==="
            tr -d '
 ' < "$p" | base64 -d > /tmp/p.bin 2>/tmp/err
            if [ $? -ne 0 ]; then cat /tmp/err; continue; fi
            gzip -t /tmp/p.bin 2>/tmp/err
            if [ $? -ne 0 ]; then cat /tmp/err; continue; fi
            gzip -dc /tmp/p.bin > /tmp/p.dec 2>/tmp/err
            echo "bytes=$(wc -c < /tmp/p.dec)"
            echo "sha=$(sha256sum /tmp/p.dec | cut -d' ' -f1)"
            head -c 140 /tmp/p.dec | tr '\0' ' '
            echo
          done
